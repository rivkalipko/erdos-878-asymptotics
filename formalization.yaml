version: "v0.4"
project:
  name: An asymptotic equivalent for the harmonic sum in Erdős Problem 878(v)
  description: >-
    Let f(n) be the sum over prime divisors p of n of the greatest power of p
    at most n. The weighted sum of f(n)/n over 1 ≤ n < x is asymptotic to an
    explicit sum over primes p ≤ (log x)^2. Each prime contributes a term
    depending on the remainder of log x modulo log p. The proof combines a
    finite harmonic-sum estimate with a uniform short-interval prime bound.
  authors: [Rivka Lipkovitz]
  responsible_maintainers: [Rivka Lipkovitz]
  license: Apache-2.0
